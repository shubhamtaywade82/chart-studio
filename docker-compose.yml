services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"

  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
      target: build
    command: npm run -w @chart-studio/gateway dev
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "4100"
      GATEWAY_CORS_ORIGIN: "*"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_DISABLE: ${OLLAMA_DISABLE:-0}
      AI_NARRATIVE_MODEL: ${AI_NARRATIVE_MODEL:-llama3.2:3b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    ports:
      - "4100:4100"
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./packages/gateway
          target: /app/packages/gateway
          ignore: [node_modules/]
        - action: sync
          path: ./packages/adapter-core
          target: /app/packages/adapter-core
          ignore: [node_modules/]
        - action: rebuild
          path: package.json

  adapter-binance:
    build:
      context: .
      dockerfile: packages/adapter-binance/Dockerfile
      target: build
    command: npm run -w @chart-studio/adapter-binance dev
    environment:
      REDIS_URL: redis://redis:6379
      BINANCE_PRODUCT: ${BINANCE_PRODUCT:-usdm}
    depends_on:
      - redis
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./packages/adapter-binance
          target: /app/packages/adapter-binance
          ignore: [node_modules/]
        - action: sync
          path: ./packages/adapter-core
          target: /app/packages/adapter-core
          ignore: [node_modules/]
        - action: rebuild
          path: package.json

  adapter-dhanhq:
    build:
      context: .
      dockerfile: packages/adapter-dhanhq/Dockerfile
      target: build
    command: npm run -w @chart-studio/adapter-dhanhq dev
    network_mode: "host"
    environment:
      REDIS_URL: redis://127.0.0.1:6381
      DHAN_AUTH_MODE: ${DHAN_AUTH_MODE:-}
      DHAN_CLIENT_ID: ${DHAN_CLIENT_ID:-}
      DHAN_PIN: ${DHAN_PIN:-}
      DHAN_TOTP_SECRET: ${DHAN_TOTP_SECRET:-}
      DHAN_ACCESS_TOKEN: ${DHAN_ACCESS_TOKEN:-}
      ALGO_SCALPER_URL: ${ALGO_SCALPER_URL:-}
      ALGO_SCALPER_API_KEY: ${ALGO_SCALPER_API_KEY:-}
      DHAN_FEED_MODE: ${DHAN_FEED_MODE:-full}
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./packages/adapter-dhanhq
          target: /app/packages/adapter-dhanhq
          ignore: [node_modules/]
        - action: sync
          path: ./packages/adapter-core
          target: /app/packages/adapter-core
          ignore: [node_modules/]
        - action: rebuild
          path: package.json

  ai-engine:
    build:
      context: .
      dockerfile: packages/ai-engine/Dockerfile
      target: build
    command: npm run -w @chart-studio/ai-engine dev
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_DISABLE: ${OLLAMA_DISABLE:-0}
      AI_TACTICAL_MODEL: ${AI_TACTICAL_MODEL:-mistral:7b}
      AI_NARRATIVE_MODEL: ${AI_NARRATIVE_MODEL:-llama3.2:3b}
      AI_RISK_MODEL: ${AI_RISK_MODEL:-codellama:7b}
      AI_STRATEGIC_MODEL: ${AI_STRATEGIC_MODEL:-mixtral:8x7b}
      AI_EMBED_MODEL: ${AI_EMBED_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./packages/ai-engine
          target: /app/packages/ai-engine
          ignore: [node_modules/]
        - action: sync
          path: ./packages/adapter-core
          target: /app/packages/adapter-core
          ignore: [node_modules/]
        - action: rebuild
          path: package.json

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      - gateway
    ports:
      - "5174:80"
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./ui
        - action: rebuild
          path: ./packages/indicator-runtime
        - action: rebuild
          path: package.json

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6381:6379"

  gateway:
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
      target: build
    command: npm run -w @chart-studio/gateway dev
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      PORT: "4100"
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    ports:
      - "4100:4100"
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./packages/gateway
          target: /app/packages/gateway
          ignore: [node_modules/]
        - action: sync
          path: ./packages/adapter-core
          target: /app/packages/adapter-core
          ignore: [node_modules/]
        - action: rebuild
          path: package.json

  adapter-binance:
    build:
      context: .
      dockerfile: packages/adapter-binance/Dockerfile
      target: build
    command: npm run -w @chart-studio/adapter-binance dev
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./packages/adapter-binance
          target: /app/packages/adapter-binance
          ignore: [node_modules/]
        - action: sync
          path: ./packages/adapter-core
          target: /app/packages/adapter-core
          ignore: [node_modules/]
        - action: rebuild
          path: package.json

  adapter-dhanhq:
    build:
      context: .
      dockerfile: packages/adapter-dhanhq/Dockerfile
      target: build
    command: npm run -w @chart-studio/adapter-dhanhq dev
    network_mode: "host"
    volumes:
      - ./.dhan_cache:/app/.dhan_cache
    env_file: [.env]
    environment:
      REDIS_URL: redis://127.0.0.1:6381
      DHAN_CACHE_PATH: /app/.dhan_cache/token.json
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./packages/adapter-dhanhq
          target: /app/packages/adapter-dhanhq
          ignore: [node_modules/]
        - action: sync
          path: ./packages/adapter-core
          target: /app/packages/adapter-core
          ignore: [node_modules/]
        - action: rebuild
          path: package.json

  ai-engine:
    build:
      context: .
      dockerfile: packages/ai-engine/Dockerfile
      target: build
    command: npm run -w @chart-studio/ai-engine dev
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./packages/ai-engine
          target: /app/packages/ai-engine
          ignore: [node_modules/]
        - action: sync
          path: ./packages/adapter-core
          target: /app/packages/adapter-core
          ignore: [node_modules/]
        - action: rebuild
          path: package.json

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    depends_on:
      - gateway
    ports:
      - "5174:80"
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./ui
        - action: rebuild
          path: ./packages/indicator-runtime
        - action: rebuild
          path: package.json
